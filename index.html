<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório - Quero te Conhecer</title>
    <style>
        :root {
            --primary-color: #d32f2f;
            --primary-hover: #b71c1c;
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #cccccc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 480px;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h2 {
            color: var(--primary-color);
            font-size: 24px;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 14px;
            color: #666;
        }

        .form-group {
            margin-bottom: 16px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 15px;
            background-color: #fff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(211, 47, 47, 0.15);
        }

        /* Searchable Select Custom Component */
        .custom-select {
            position: relative;
            width: 100%;
        }

        .select-trigger {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 15px;
            background-color: #fff;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            transition: border-color 0.2s;
        }

        .select-trigger .arrow {
            font-size: 10px;
            color: #666;
            transition: transform 0.2s;
        }

        .custom-select.open .select-trigger {
            border-color: var(--primary-color);
        }

        .custom-select.open .arrow {
            transform: rotate(180deg);
        }

        .custom-select.disabled .select-trigger {
            background-color: #f0f0f0;
            cursor: not-allowed;
            color: #888;
            border-color: #e0e0e0;
        }

        .select-dropdown {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.12);
            z-index: 100;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        .custom-select.open .select-dropdown {
            display: flex;
        }

        .search-box {
            padding: 8px;
            border-bottom: 1px solid #eee;
            background-color: #fafafa;
        }

        .search-input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--primary-color);
        }

        .options-list {
            list-style: none;
            max-height: 180px;
            overflow-y: auto;
            margin: 0;
            padding: 0;
        }

        .options-list li {
            padding: 10px 12px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.15s;
        }

        .options-list li:hover {
            background-color: #f4f4f9;
            color: var(--primary-color);
            font-weight: 500;
        }

        .options-list li.no-result {
            color: #999;
            cursor: default;
            text-align: center;
        }

        .section-divider {
            margin: 24px 0 16px 0;
            padding-bottom: 8px;
            border-bottom: 2px solid #eee;
            color: #444;
            font-size: 16px;
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .total-card {
            background-color: #f8f9fa;
            border: 1px dashed #ccc;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            margin: 16px 0;
            font-weight: bold;
            color: #444;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, opacity 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            margin-top: 16px;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
        }

        .success { 
            display: block !important;
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #a5d6a7;
        }

        .error { 
            display: block !important;
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Relatório Semanal</h2>
        <p>App Quero te Conhecer</p>
    </div>
    
    <form id="relatorio-form">
        <!-- Searchable Select: Cidade -->
        <div class="form-group">
            <label>Cidade:</label>
            <div class="custom-select" id="select-cidade">
                <input type="hidden" name="cidade" id="cidade-value" required>
                <div class="select-trigger">
                    <span class="selected-text">Selecione a cidade...</span>
                    <span class="arrow">▼</span>
                </div>
                <div class="select-dropdown">
                    <div class="search-box">
                        <input type="text" class="search-input" placeholder="Pesquisar cidade...">
                    </div>
                    <ul class="options-list"></ul>
                </div>
            </div>
        </div>

        <!-- Searchable Select: Bairro -->
        <div class="form-group">
            <label>Bairro da Igreja:</label>
            <div class="custom-select disabled" id="select-bairro">
                <input type="hidden" name="bairro" id="bairro-value" required>
                <div class="select-trigger">
                    <span class="selected-text">Selecione a cidade primeiro...</span>
                    <span class="arrow">▼</span>
                </div>
                <div class="select-dropdown">
                    <div class="search-box">
                        <input type="text" class="search-input" placeholder="Pesquisar bairro...">
                    </div>
                    <ul class="options-list"></ul>
                </div>
            </div>
        </div>

        <h3 class="section-divider">Quantidade de Novos Usuários</h3>

        <div class="grid-inputs">
            <div class="form-group">
                <label for="membro_mulher">Membros (Mulheres):</label>
                <input type="number" id="membro_mulher" name="membro_mulher" min="0" required value="0" class="counter">
            </div>

            <div class="form-group">
                <label for="membro_homem">Membros (Homens):</label>
                <input type="number" id="membro_homem" name="membro_homem" min="0" required value="0" class="counter">
            </div>

            <div class="form-group">
                <label for="obreiro">Obreiros:</label>
                <input type="number" id="obreiro" name="obreiro" min="0" required value="0" class="counter">
            </div>

            <div class="form-group">
                <label for="obreira">Obreiras:</label>
                <input type="number" id="obreira" name="obreira" min="0" required value="0" class="counter">
            </div>
        </div>

        <div class="total-card">
            Total de Novos Cadastros: <span id="total-display">0</span>
        </div>

        <button type="submit" id="btn-submit">Enviar Relatório</button>
    </form>

    <div id="message"></div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxHOq7Xi7iclqOWFfLcjPqw6_7HC9uef4kWTbdq1AsEUKlwKxPhLkixG01RbM9o3bmy/exec';

    // Lista mapeada de cidades e bairros
    const locations = {
        "Barreirinha": ["Barreirinha"],
        "Borba": ["Borba"],
        "Coari": ["Coari"],
        "Iranduba": ["Iranduba"],
        "Itacoatiara": ["Itacoatiara"],
        "Manacapuru": ["Liberdade", "Mutirão", "Sede"],
        "Manaus": [
            "Alvorada 1", "Amazonino Mendes", "Americo Medeiros", "Armando Mendes", 
            "Braga Mendes", "Cachoeirinha", "Canaranas", "Carbrás", "Catedral", 
            "Cidade de Deus", "Cidade Nova", "Compensa 1", "Compensa 3", "Educandos", 
            "Grande Vitória", "Gustavo Nascimento", "João Paulo", "Jorge Teixeira 3", 
            "Jorge Teixeira 4", "Lago Azul", "Lirio do Vale", "Manoa", "Mauazinho", 
            "Monte das Oliveiras", "Nova Cidade", "Novo Aleixo", "Novo Israel", 
            "Ouro Verde", "Parque Riachuello", "Petropolis", "Petropolis 2", 
            "Ponta Negra", "Raiz", "Redenção", "Santo Antonio", "Santos Dumont", 
            "São José 1", "São José 2", "Terra Nova", "Terra Nova 3", 
            "União da Vitório", "Viver Melhor", "Zumbi"
        ],
        "Manicoré": ["Manicoré"],
        "Novo Aripuanã": ["Novo Aripuanã"],
        "Parintins": ["Parintins"],
        "Presidente Figueiredo": ["Presidente Figueiredo"],
        "São Gabriel da Cachoeira": ["São Gabriel da Cachoeira"],
        "Tabatinga": ["Tabatinga"],
        "Tefé": ["Tefé"]
    };

    // Componente de Select com Busca Integrada
    class SearchableSelect {
        constructor(containerId, placeholder, onSelectCallback) {
            this.container = document.getElementById(containerId);
            this.hiddenInput = this.container.querySelector('input[type="hidden"]');
            this.trigger = this.container.querySelector('.select-trigger');
            this.selectedText = this.container.querySelector('.selected-text');
            this.dropdown = this.container.querySelector('.select-dropdown');
            this.searchInput = this.container.querySelector('.search-input');
            this.optionsList = this.container.querySelector('.options-list');
            this.placeholder = placeholder;
            this.onSelectCallback = onSelectCallback;
            this.items = [];

            this.initEvents();
        }

        initEvents() {
            this.trigger.addEventListener('click', () => {
                if (!this.container.classList.contains('disabled')) {
                    this.toggleDropdown();
                }
            });

            this.searchInput.addEventListener('input', (e) => {
                this.filterItems(e.target.value);
            });

            document.addEventListener('click', (e) => {
                if (!this.container.contains(e.target)) {
                    this.closeDropdown();
                }
            });
        }

        setItems(items) {
            this.items = items.sort();
            this.renderItems(this.items);
        }

        renderItems(items) {
            this.optionsList.innerHTML = '';
            
            if (items.length === 0) {
                const noRes = document.createElement('li');
                noRes.className = 'no-result';
                noRes.textContent = 'Nenhum resultado';
                this.optionsList.appendChild(noRes);
                return;
            }

            items.forEach(item => {
                const li = document.createElement('li');
                li.textContent = item;
                li.addEventListener('click', () => this.selectItem(item));
                this.optionsList.appendChild(li);
            });
        }

        filterItems(query) {
            const filtered = this.items.filter(item => 
                item.toLowerCase().includes(query.toLowerCase())
            );
            this.renderItems(filtered);
        }

        selectItem(value) {
            this.hiddenInput.value = value;
            this.selectedText.textContent = value;
            this.closeDropdown();
            if (this.onSelectCallback) {
                this.onSelectCallback(value);
            }
        }

        toggleDropdown() {
            const isOpen = this.container.classList.contains('open');
            // Fechar outros dropdowns abertos na página
            document.querySelectorAll('.custom-select').forEach(cs => cs.classList.remove('open'));
            
            if (!isOpen) {
                this.container.classList.add('open');
                this.searchInput.value = '';
                this.filterItems('');
                setTimeout(() => this.searchInput.focus(), 100);
            }
        }

        closeDropdown() {
            this.container.classList.remove('open');
        }

        enable() {
            this.container.classList.remove('disabled');
        }

        disable(message) {
            this.container.classList.add('disabled');
            this.hiddenInput.value = '';
            this.selectedText.textContent = message;
            this.closeDropdown();
        }

        reset() {
            this.hiddenInput.value = '';
            this.selectedText.textContent = this.placeholder;
            this.searchInput.value = '';
        }
    }

    // Inicialização dos Selects
    const citySelect = new SearchableSelect('select-cidade', 'Selecione a cidade...', (selectedCity) => {
        if (selectedCity && locations[selectedCity]) {
            bairroSelect.enable();
            bairroSelect.reset();
            bairroSelect.setItems(locations[selectedCity]);
        }
    });

    const bairroSelect = new SearchableSelect('select-bairro', 'Selecione o bairro...', null);

    // Carregar Cidades
    citySelect.setItems(Object.keys(locations));

    // Contador Total
    const counters = document.querySelectorAll('.counter');
    const totalDisplay = document.getElementById('total-display');

    function updateTotal() {
        let sum = 0;
        counters.forEach(input => {
            sum += parseInt(input.value) || 0;
        });
        totalDisplay.innerText = sum;
    }

    counters.forEach(input => input.addEventListener('input', updateTotal));

    // Envio do formulário
    const form = document.getElementById('relatorio-form');
    const message = document.getElementById('message');
    const btnSubmit = document.getElementById('btn-submit');

    form.addEventListener('submit', e => {
        e.preventDefault();

        // Validação manual dos selects customizados
        if (!document.getElementById('cidade-value').value) {
            alert('Por favor, selecione uma cidade.');
            return;
        }
        if (!document.getElementById('bairro-value').value) {
            alert('Por favor, selecione um bairro.');
            return;
        }

        btnSubmit.innerText = 'Enviando...';
        btnSubmit.disabled = true;
        message.className = '';
        message.style.display = 'none';

        fetch(scriptURL, { 
            method: 'POST', 
            body: new FormData(form)
        })
        .then(response => {
            message.innerText = 'Relatório enviado com sucesso!';
            message.className = 'success';
            form.reset();
            citySelect.reset();
            bairroSelect.disable('Selecione a cidade primeiro...');
            updateTotal();
        })
        .catch(error => {
            message.innerText = 'Erro ao enviar o relatório. Verifique sua conexão e tente novamente.';
            message.className = 'error';
            console.error('Erro no envio:', error);
        })
        .finally(() => {
            btnSubmit.innerText = 'Enviar Relatório';
            btnSubmit.disabled = false;
            setTimeout(() => { 
                message.style.display = 'none'; 
            }, 6000);
        });
    });
</script>

</body>
</html>
