<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório - Quero te Conhecer</title>
    <style>
        :root {
            --primary-color: #d32f2f;
            --primary-hover: #b71c1c;
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #cccccc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 480px;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h2 {
            color: var(--primary-color);
            font-size: 24px;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 14px;
            color: #666;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"], 
        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 15px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus, 
        input[type="number"]:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(211, 47, 47, 0.15);
        }

        .section-divider {
            margin: 24px 0 16px 0;
            padding-bottom: 8px;
            border-bottom: 2px solid #eee;
            color: #444;
            font-size: 16px;
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .total-card {
            background-color: #f8f9fa;
            border: 1px dashed #ccc;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            margin: 16px 0;
            font-weight: bold;
            color: #444;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, opacity 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            margin-top: 16px;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
        }

        .success { 
            display: block !important;
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #a5d6a7;
        }

        .error { 
            display: block !important;
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Relatório Semanal</h2>
        <p>App Quero te Conhecer</p>
    </div>
    
    <form id="relatorio-form">
        <div class="form-group">
            <label for="cidade">Cidade:</label>
            <input type="text" id="cidade" name="cidade" required placeholder="Ex: Manaus">
        </div>

        <div class="form-group">
            <label for="bairro">Bairro da Igreja:</label>
            <input type="text" id="bairro" name="bairro" required placeholder="Ex: Centro">
        </div>

        <h3 class="section-divider">Quantidade de Novos Usuários</h3>

        <div class="grid-inputs">
            <div class="form-group">
                <label for="membro_mulher">Membros (Mulheres):</label>
                <input type="number" id="membro_mulher" name="membro_mulher" min="0" required value="0" class="counter">
            </div>

            <div class="form-group">
                <label for="membro_homem">Membros (Homens):</label>
                <input type="number" id="membro_homem" name="membro_homem" min="0" required value="0" class="counter">
            </div>

            <div class="form-group">
                <label for="obreiro">Obreiros:</label>
                <input type="number" id="obreiro" name="obreiro" min="0" required value="0" class="counter">
            </div>

            <div class="form-group">
                <label for="obreira">Obreiras:</label>
                <input type="number" id="obreira" name="obreira" min="0" required value="0" class="counter">
            </div>
        </div>

        <div class="total-card">
            Total de Novos Cadastros: <span id="total-display">0</span>
        </div>

        <button type="submit" id="btn-submit">Enviar Relatório</button>
    </form>

    <div id="message"></div>
</div>

<script>
    // Cole abaixo a URL gerada no Google Apps Script após a implantação
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxHOq7Xi7iclqOWFfLcjPqw6_7HC9uef4kWTbdq1AsEUKlwKxPhLkixG01RbM9o3bmy/exec';
    
    const form = document.getElementById('relatorio-form');
    const message = document.getElementById('message');
    const btnSubmit = document.getElementById('btn-submit');
    const counters = document.querySelectorAll('.counter');
    const totalDisplay = document.getElementById('total-display');

    // Atualiza a contagem total de entradas em tempo real
    function updateTotal() {
        let sum = 0;
        counters.forEach(input => {
            sum += parseInt(input.value) || 0;
        });
        totalDisplay.innerText = sum;
    }

    counters.forEach(input => input.addEventListener('input', updateTotal));

    form.addEventListener('submit', e => {
        e.preventDefault();
        
        btnSubmit.innerText = 'Enviando...';
        btnSubmit.disabled = true;
        message.className = '';
        message.style.display = 'none';

        fetch(scriptURL, { 
            method: 'POST', 
            body: new FormData(form)
        })
        .then(response => {
            message.innerText = 'Relatório enviado com sucesso!';
            message.className = 'success';
            form.reset();
            updateTotal();
        })
        .catch(error => {
            message.innerText = 'Erro ao enviar o relatório. Verifique sua conexão e tente novamente.';
            message.className = 'error';
            console.error('Erro no envio:', error);
        })
        .finally(() => {
            btnSubmit.innerText = 'Enviar Relatório';
            btnSubmit.disabled = false;
            setTimeout(() => { 
                message.style.display = 'none'; 
            }, 6000);
        });
    });
</script>

</body>
</html>
